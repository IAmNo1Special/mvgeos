[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n"
body = """
{% if version %}\n## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\n{% else %}\n## [Unreleased]\n{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% if commit.breaking %} **BREAKING CHANGE**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
footer = """
---\n*Generated by [git-cliff](https://github.com/orhun/git-cliff)*
"""

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
    { body = "BREAKING CHANGE", group = "Breaking Changes" },
    { body = "DEPRECATED", group = "Deprecated" },
    { group = "Other" }
]
filter_commits = false
ignore_merge_commits = true
ignore_commits = ["^Merge pull request", "^Merge branch"]
tag_pattern = "v*"
sort = "oldest"
topo_order = false

[commit_parsers]
feat = { group = "Features", scope = true }
fix = { group = "Bug Fixes", scope = true }
perf = { group = "Performance", scope = true }
refactor = { group = "Refactoring", scope = true }
docs = { group = "Documentation", scope = true }
test = { group = "Tests", scope = true }
build = { group = "Build System", scope = true }
ci = { group = "Continuous Integration", scope = true }
chore = { group = "Chores", scope = true }
revert = { group = "Reverts", scope = true }
breaking = { group = "Breaking Changes", scope = true }
deprecated = { group = "Deprecated", scope = true }
