[project]
name = "mvgeos-cli"
version = "0.1.0"
description = "CLI entry point for MvgeOS"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "rich>=13.0",
    "typer>=0.27.1",
    "prompt-toolkit>=3.0",
]

[project.scripts]
mvgeos = "mvgeos_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_cli"]

[tool.ruff]
extend = "../pyproject.toml"
