[project]
name = "mvgeos-cli"
version = "1.6.0"
description = "CLI entry point for MvgeOS"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "coding-mvge",
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "rich>=13.0",
    "typer>=0.27.1",
    "prompt-toolkit>=3.0",
]

[project.scripts]
mvgeos = "mvgeos_cli.main:main"

[tool.uv.sources]
coding-mvge = { workspace = true }
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
