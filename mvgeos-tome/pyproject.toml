[project]
name = "mvgeos-tome"
version = "0.1.0"
description = "Session persistence using JSONL storage with file locking and in-memory index"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "filelock>=3.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_tome"]

[tool.ruff]
extend = "../pyproject.toml"
