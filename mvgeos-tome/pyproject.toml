[project]
name = "mvgeos-tome"
version = "1.1.0"
description = "Session persistence using JSONL storage with file locking and in-memory index"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "filelock>=3.32.3",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
