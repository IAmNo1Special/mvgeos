[project]
name = "mvgeos-spells"
version = "0.1.0"
description = "Spell system: bash execution, file read/write/edit, grep, find, ls"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "aiofiles>=23.2",
    "filelock>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../../../pyproject.toml"