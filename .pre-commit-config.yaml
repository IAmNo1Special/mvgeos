repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run python -m ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run python -m ruff format --check
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run python -m mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Fast unit-suite smoke run: no coverage gate (TESTING.md section 3).
      # CI owns coverage measurement over the hermetic whole.
      - id: pytest
        name: unit tests
        entry: uv run python -m pytest coding-mvge/tests/unit mvgeos-agent/tests/unit mvgeos-provider/tests/unit mvgeos-runes/tests/unit mvgeos-tome/tests/unit mvgeos-cli/tests/unit mvgeos-gui/tests/unit
        language: system
        types: [python]
        pass_filenames: false
