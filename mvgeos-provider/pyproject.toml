[project]
name = "mvgeos-provider"
version = "0.2.1"
description = "Provider abstraction protocol and OpenRouter implementation"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mvgeos-core",
]

[tool.uv.sources]
mvgeos-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
