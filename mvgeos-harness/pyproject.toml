[project]
name = "mvgeos-harness"
version = "0.1.0"
description = "MvgeOS Harness - wraps MvgeLoop and owns session lifecycle (compaction, steering, follow-ups, turn callbacks)"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "mvgeos-agent",
    "mvgeos-provider",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_harness"]

[tool.ruff]
extend = "../pyproject.toml"