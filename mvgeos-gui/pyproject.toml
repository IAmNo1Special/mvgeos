[project]
name = "mvgeos-gui"
version = "0.1.0"
description = "Desktop GUI for MvgeOS powered by NiceGUI"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "coding-mvge",
    "mvgeos-agent",
    "mvgeos-cli",
    "mvgeos-provider",
    "mvgeos-runes",
    "mvgeos-tome",
    "nicegui>=2.10.0",
    "pathspec>=0.12.0",
    "pywebview>=6.2.1",
]

[project.scripts]
mvgeos-gui = "mvgeos_gui.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
coding-mvge = { workspace = true }
mvgeos-agent = { workspace = true }
mvgeos-cli = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }
mvgeos-tome = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_gui"]

[tool.ruff]
extend = "../pyproject.toml"
