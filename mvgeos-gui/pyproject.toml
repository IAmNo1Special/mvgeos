[project]
name = "mvgeos-gui"
version = "3.0.0"
description = "Desktop GUI for MvgeOS powered by NiceGUI"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "coding-mvge",
    "keyring>=24.0",
    "mvgeos-agent",
    "mvgeos-core",
    "mvgeos-provider",
    "mvgeos-runes",
    "mvgeos-tome",
    "nicegui>=2.10.0",
    "pathspec>=0.12.0",
    "pywebview>=6.2.1",
]

[project.scripts]
mvgeos-gui = "mvgeos_gui.main:main"

[tool.uv.sources]
coding-mvge = { workspace = true }
mvgeos-agent = { workspace = true }
mvgeos-core = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }
mvgeos-tome = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
