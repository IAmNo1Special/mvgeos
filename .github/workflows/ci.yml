name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One leg per package: unit + integration tiers, fully hermetic
  # (mocked seams, no secrets, no network). Bare --cov reproduces the
  # bare full-suite run's measurement semantics (everything imported);
  # the per-leg union then matches it once combined. The gate is
  # disabled here because a single package cannot clear the combined
  # floor -- enforcement happens once, in the aggregate job below.
  # Each leg uploads its .coverage.* data file for the aggregate job.
  test:
    strategy:
      fail-fast: false
      matrix:
        package:
          - mvgeos-core
          - mvgeos-agent
          - mvgeos-provider
          - mvgeos-runes
          - mvgeos-tome
          - mvgeos-cli
          - mvgeos-gui
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      install-command: "uv sync --all-packages"
      run-lint: false
      # COVERAGE_FILE inline: each matrix leg writes its own data file for the aggregate job.
      test-commands: "COVERAGE_FILE=.coverage.${{ matrix.package }} uv run python -m pytest --cov --cov-report=term-missing --cov-fail-under=0 ${{ matrix.package }}/tests/unit ${{ matrix.package }}/tests/integration"
      coverage-artifact-name: "coverage-data-${{ matrix.package }}"
      timeout-minutes: 20

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage across packages
        run: uv run python -m coverage combine coverage-data
      - name: Enforce the combined coverage floor
        run: uv run python -m coverage report

  # The marketplace clones this repository and imports its internals from
  # main, so removing or renaming a public symbol here breaks it without any
  # signal in this repository. DEFAULT_TOME_DIR -> sessions_dir() did exactly
  # that and took ten import errors to surface, on the marketplace's main.
  #
  # Blocks an ADR from describing code that no longer exists. This index drifted
  # silently for 227 commits: ADR-0007 named TomeLedger, an in-memory Index and
  # filelock, none of which existed in any src/, and nothing noticed. Keep it
  # blocking and dependency-free -- the check reads source as text, so it runs in
  # about a second with no sync, no install and no marketplace checkout.
  adr-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Verify every ADR status and contracted symbol matches the source
        run: uv run --no-project python mvgeos-core/scripts/check_adr_contract.py

  # Verifies every engine import in a marketplace checkout resolves and is
  # declared in the relevant __all__. Keep it blocking: a silent API removal
  # is the failure this exists to prevent. The cost is that this repository's
  # CI now depends on the marketplace being reachable, which the scheduled
  # marketplace run cannot compensate for if this is the only guard.
  marketplace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-packages

      - name: Check out the marketplace
        uses: actions/checkout@v5
        with:
          repository: IAmNo1Special/mvgeos-marketplace
          path: marketplace

      - name: Verify the marketplace only imports declared engine API
        run: >-
          uv run python mvgeos-core/scripts/check_marketplace_contract.py
          marketplace

  # Reproduces the published scorecard: the same numbers `uv run python
  # scripts/scorecard.py` prints locally, measured against fresh shallow
  # clones of all seven projects.
  #
  # NON-BLOCKING, deliberately. Six of the seven repositories are not ours and
  # move under us daily; a peer renaming a directory, or going unreachable,
  # must not be able to fail our build. `continue-on-error` on the job is what
  # makes it non-blocking -- the job still runs and still posts its table, and
  # only its conclusion is discarded.
  #
  # Promote to blocking once this job has been green for three consecutive
  # runs on main, at which point delete the `continue-on-error` line.
  #
  # Costs roughly 2 GB of shallow clones and a few minutes per run, which is
  # also why there is no cache here: the job is the measurement, and a cached
  # clone would quietly measure a stale commit.
  scorecard:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Measure the scorecard
        id: measure
        # --online enables measure 5, one HTTP GET per package name. That is
        # the axis we currently lose outright, so it is the one most worth
        # watching; it is also the only check here that touches the network.
        #
        # The gate reason belongs in the log, not only in the step summary.
        # Piping stdout into $GITHUB_STEP_SUMMARY left the log saying only
        # "exit code 1" and named nothing, which is why a real regression read
        # as unexplained for weeks. The exit code still propagates, so the job
        # can still go red and the promotion criterion above stays reachable.
        run: |
          set +e
          uv run --no-project python scripts/scorecard.py \
            --online --markdown --json scorecard.json > report.md 2>&1
          code=$?
          set -e
          cat report.md
          {
            echo "## Scorecard (script exit \`$code\`)"
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload the report
        # `always()` because the step above can legitimately fail, and a failed
        # measurement is still the measurement someone needs to read.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-pr-${{ github.run_number }}
          path: |
            scorecard.json
            report.md
          # `warn` rather than `error`, unlike the scheduled scorecard.yml:
          # that job always exits 0, so a missing file there means the script
          # crashed. Here the step can fail legitimately, and a hard error on
          # the upload would add a second confusing red on top of the real one.
          if-no-files-found: warn
          retention-days: 30

  lint:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      install-command: "uv sync --all-packages"
      run-tests: false
      timeout-minutes: 10

  # Cross-platform test verification: validates execution on Windows and macOS.
  test-crossplatform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      runs-on: ${{ matrix.os }}
      install-command: "uv sync --all-packages"
      run-lint: false
      test-commands: "uv run python -m pytest"
      timeout-minutes: 25

  # Release automation: needs IS the wait-for-green. This job only starts
  # once test + coverage + lint + crossplatform all succeeded, so every tag sits on verified
  # code by construction. Pushes a chore(release) commit + v* tag and
  # dispatches release.yml (tag pushes via GITHUB_TOKEN don't trigger
  # workflows due to GitHub's loop guard). PR runs and the bot's own
  # release commits skip via the if guard below.
  bump:
    needs: [test, coverage, lint, test-crossplatform]
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One bump at a time. Two overlapping bumps would both compute a version
    # from the same last tag, race to create the same tag, and one would push a
    # main that the other cannot fast-forward. cancel-in-progress is false so a
    # second push queues behind the first instead of killing a bump that is
    # already halfway through committing.
    concurrency:
      group: bump-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Determine bump type from commits since last tag
        id: bump_type
        run: |
          if LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            RANGE="${LAST_TAG}..HEAD"
            SUBJECTS=$(git log --format=%s "$RANGE")
            BODIES=$(git log --format=%b "$RANGE")
          else
            # No tags yet: scan the entire history
            SUBJECTS=$(git log --format=%s)
            BODIES=$(git log --format=%b)
          fi

          # Conventional Commits -> SemVer (mirrors cliff.toml parsers):
          #   feat!:/fix!: or BREAKING CHANGE footer -> major
          #   feat:                                  -> minor
          #   fix:/perf:                             -> patch
          #   docs/test/ci/chore/refactor/build only -> no release
          if echo "$SUBJECTS" | grep -Eq '^[a-z]+(\([^)]*\))?!:' ||
             echo "$BODIES" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            TYPE=major
          elif echo "$SUBJECTS" | grep -Eq '^feat(\(|:)'; then
            TYPE=minor
          elif echo "$SUBJECTS" | grep -Eq '^(fix|perf)(\(|:)'; then
            TYPE=patch
          else
            TYPE=none
          fi

          # Zero-Ver (0.x.y) pre-release remapping:
          # In initial development (< 1.0.0):
          #   breaking change (major) -> minor (e.g. 0.1.0 -> 0.2.0)
          #   feature (minor)         -> patch (e.g. 0.1.0 -> 0.1.1)
          # Once >= 1.0.0, standard SemVer applies directly.
          CURRENT_VERSION="$(uv version --short 2>/dev/null || echo "0.0.0")"
          if [[ "$CURRENT_VERSION" =~ ^0\. ]]; then
            if [ "$TYPE" = "major" ]; then
              TYPE=minor
            elif [ "$TYPE" = "minor" ]; then
              TYPE=patch
            fi
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump type since last tag: $TYPE (current version: $CURRENT_VERSION)"

      - name: Bump workspace versions
        if: steps.bump_type.outputs.type != 'none'
        id: bump
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.type }}
        run: |
          for pkg in mvgeos mvgeos-core mvgeos-agent mvgeos-provider mvgeos-tome \
                     mvgeos-runes mvgeos-cli mvgeos-gui; do
            uv version --bump "$BUMP_TYPE" --package "$pkg" --no-sync
          done
          uv lock

          NEW_VERSION="$(uv version --short)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      # uv version rewrites project.version only. Internal dependencies carry an
      # explicit >= floor so published wheels record a resolvable Requires-Dist
      # rather than an unbounded name, and those floors must move with the
      # lockstep bump or they silently rot back into the bug they prevent.
      - name: Refresh internal dependency floors
        if: steps.bump_type.outputs.type != 'none'
        run: |
          NEW_VERSION="$(uv version --short)"
          python3 - "$NEW_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          new = sys.argv[1]
          pattern = re.compile(
              r'^(?P<prefix>\s*")(?P<name>mvgeos(?:-[a-z]+)?)>=\d[^"]*(?P<suffix>",?\s*)$',
              re.MULTILINE,
          )
          for path in [Path("pyproject.toml"), *sorted(Path(".").glob("*/pyproject.toml"))]:
              text = path.read_text()
              updated, count = pattern.subn(rf'\g<prefix>\g<name>>={new}\g<suffix>', text)
              if count:
                  path.write_text(updated)
                  print(f"{path}: refreshed {count} internal dep floor(s)")
          PY
          uv lock

          # Nothing is committed here on purpose. There is no release commit to
          # amend yet -- the step that makes one runs next -- so an --amend here
          # rewrites whatever commit was checked out instead. On a push to main
          # that is a merge commit, which meant folding the version bump into
          # someone else's merge under the merge's own message, and leaving the
          # real "chore(release)" step with an empty tree and exit code 1. The
          # refreshed floors ride along in the working tree and are staged by
          # that next step, which is what "into the release commit" requires.

      - name: Commit, tag, and push
        if: steps.bump_type.outputs.type != 'none'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock \
            mvgeos-core/pyproject.toml \
            mvgeos-agent/pyproject.toml mvgeos-provider/pyproject.toml \
            mvgeos-tome/pyproject.toml mvgeos-runes/pyproject.toml \
            mvgeos-cli/pyproject.toml mvgeos-gui/pyproject.toml

          git commit -m "chore(release): v$NEW_VERSION"

          # Someone else can land on main while this job is working -- three
          # agents push here routinely. Rebase the release commit onto whatever
          # main is now, and only give up if that rebase conflicts. This step
          # already waited out any other bump (see concurrency above), so the
          # only thing that can move main underneath us is a hand push, and a
          # conflicted rebase means the next push to main re-runs this whole
          # bump against content that includes the conflict resolution.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::warning::main moved under this bump and the rebase conflicted; no release this run. The next push to main re-triggers the bump."
            exit 0
          fi

          # Tagged after the rebase, not before: a rebase rewrites the commit, so
          # a tag made beforehand would point at an orphaned object and the tag
          # push would publish a commit that is not on main.
          git tag "v$NEW_VERSION"

          # Deliberately no [skip ci]: loop safety comes from the
          # job-level guard above -- the re-triggered run's bump job
          # skips on its own head_commit.
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Dispatch Release workflow
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # GITHUB_TOKEN pushes don't trigger workflows (GitHub loop guard),
          # so the tag push above won't fire release.yml. Dispatch explicitly.
          # Release's verify job re-checks the suite before publishing.
          gh workflow run Release --ref main -f version=v$NEW_VERSION -f dry_run=false
          echo "Dispatched Release for v$NEW_VERSION"
