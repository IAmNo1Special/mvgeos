name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev
      - run: >-
          uv run pytest --import-mode=importlib
          --cov=coding-mvge/coding_mvge
          --cov=mvgeos-agent/mvgeos_agent
          --cov=mvgeos-provider/mvgeos_provider
          --cov=mvgeos-runes/mvgeos_runes
          --cov=mvgeos-tome/mvgeos_tome
          --cov=mvgeos-cli/mvgeos_cli
          --cov=mvgeos-gui/mvgeos_gui
          --cov-fail-under=70
          coding-mvge/tests/unit
          mvgeos-agent/tests/unit
          mvgeos-provider/tests/unit
          mvgeos-runes/tests/unit
          mvgeos-tome/tests/unit
          mvgeos-cli/tests/unit
          mvgeos-gui/tests/unit

  # Full suite (unit + integration) with the pyproject 90% coverage floor.
  # PRs stay on the fast unit-only job; main pushes get the complete gate.
  full-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev
      - run: uv run pytest --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
