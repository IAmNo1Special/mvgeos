name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One leg per package: unit + integration tiers, fully hermetic
  # (mocked seams, no secrets, no network). Bare --cov reproduces the
  # bare full-suite run's measurement semantics (everything imported);
  # the per-leg union then matches it once combined. The gate is
  # disabled here because a single package cannot clear the combined
  # floor -- enforcement happens once, in the aggregate job below.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - coding-mvge
          - mvgeos-core
          - mvgeos-agent
          - mvgeos-provider
          - mvgeos-runes
          - mvgeos-tome
          - mvgeos-cli
          - mvgeos-gui
    env:
      COVERAGE_FILE: .coverage.${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Test ${{ matrix.package }} (unit + integration)
        run: >-
          uv run python -m pytest
          --cov
          --cov-report=term-missing
          --cov-fail-under=0
          ${{ matrix.package }}/tests/unit
          ${{ matrix.package }}/tests/integration
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.package }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # Aggregates the per-leg data files and enforces the combined floor.
  # The floor lives only in pyproject [tool.coverage.report]
  # fail_under; `coverage report` reads it from there.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage across packages
        run: uv run python -m coverage combine coverage-data
      - name: Enforce the combined coverage floor
        run: uv run python -m coverage report

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .

  # Cross-platform test verification: validates execution on Windows and macOS.
  test-crossplatform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Full test suite on ${{ matrix.os }}
        run: uv run python -m pytest

  # Release automation: needs IS the wait-for-green. This job only starts
  # once test + coverage + lint + crossplatform all succeeded, so every tag sits on verified
  # code by construction. Pushes a chore(release) commit + v* tag and
  # dispatches release.yml (tag pushes via GITHUB_TOKEN don't trigger
  # workflows due to GitHub's loop guard). PR runs and the bot's own
  # release commits skip via the if guard below.
  bump:
    needs: [test, coverage, lint, test-crossplatform]
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Determine bump type from commits since last tag
        id: bump_type
        run: |
          if LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            RANGE="${LAST_TAG}..HEAD"
            SUBJECTS=$(git log --format=%s "$RANGE")
            BODIES=$(git log --format=%b "$RANGE")
          else
            # No tags yet: scan the entire history
            SUBJECTS=$(git log --format=%s)
            BODIES=$(git log --format=%b)
          fi

          # Conventional Commits -> SemVer (mirrors cliff.toml parsers):
          #   feat!:/fix!: or BREAKING CHANGE footer -> major
          #   feat:                                  -> minor
          #   fix:/perf:                             -> patch
          #   docs/test/ci/chore/refactor/build only -> no release
          if echo "$SUBJECTS" | grep -Eq '^[a-z]+(\([^)]*\))?!:' ||
             echo "$BODIES" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            TYPE=major
          elif echo "$SUBJECTS" | grep -Eq '^feat(\(|:)'; then
            TYPE=minor
          elif echo "$SUBJECTS" | grep -Eq '^(fix|perf)(\(|:)'; then
            TYPE=patch
          else
            TYPE=none
          fi

          # Zero-Ver (0.x.y) pre-release remapping:
          # In initial development (< 1.0.0):
          #   breaking change (major) -> minor (e.g. 0.1.0 -> 0.2.0)
          #   feature (minor)         -> patch (e.g. 0.1.0 -> 0.1.1)
          # Once >= 1.0.0, standard SemVer applies directly.
          CURRENT_VERSION="$(uv version --short 2>/dev/null || echo "0.0.0")"
          if [[ "$CURRENT_VERSION" =~ ^0\. ]]; then
            if [ "$TYPE" = "major" ]; then
              TYPE=minor
            elif [ "$TYPE" = "minor" ]; then
              TYPE=patch
            fi
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump type since last tag: $TYPE (current version: $CURRENT_VERSION)"

      - name: Bump workspace versions
        if: steps.bump_type.outputs.type != 'none'
        id: bump
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.type }}
        run: |
          for pkg in mvgeos mvgeos-core mvgeos-agent mvgeos-provider mvgeos-tome \
                     mvgeos-runes mvgeos-cli mvgeos-gui coding-mvge; do
            uv version --bump "$BUMP_TYPE" --package "$pkg" --no-sync
          done
          uv lock

          NEW_VERSION="$(uv version --short)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Commit, tag, and push
        if: steps.bump_type.outputs.type != 'none'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock \
            mvgeos-core/pyproject.toml \
            mvgeos-agent/pyproject.toml mvgeos-provider/pyproject.toml \
            mvgeos-tome/pyproject.toml mvgeos-runes/pyproject.toml \
            mvgeos-cli/pyproject.toml mvgeos-gui/pyproject.toml \
            coding-mvge/pyproject.toml

          git commit -m "chore(release): v$NEW_VERSION"
          git tag "v$NEW_VERSION"

          # Deliberately no [skip ci]: loop safety comes from the
          # job-level guard above -- the re-triggered run's bump job
          # skips on its own head_commit.
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Dispatch Release workflow
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # GITHUB_TOKEN pushes don't trigger workflows (GitHub loop guard),
          # so the tag push above won't fire release.yml. Dispatch explicitly.
          # Release's verify job re-checks the suite before publishing.
          gh workflow run Release --ref main -f version=v$NEW_VERSION -f dry_run=false
          echo "Dispatched Release for v$NEW_VERSION"
