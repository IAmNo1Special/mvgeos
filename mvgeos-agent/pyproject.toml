[project]
name = "mvgeos-agent"
version = "1.14.1"
description = "Core Mvge agent loop, invocation types, state management, and spell execution"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "pydantic>=2.0",
]

[tool.uv.sources]
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
