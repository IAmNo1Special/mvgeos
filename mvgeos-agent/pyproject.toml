[project]
name = "mvgeos-agent"
version = "0.1.0"
description = "Core Mvge agent loop, invocation types, state management, and spell execution"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-spells",
    "mvgeos-runes",
    "filelock>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-spells = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_agent"]

[tool.ruff]
extend = "../../../pyproject.toml"