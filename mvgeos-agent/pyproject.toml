[project]
name = "mvgeos-agent"
version = "0.5.6"
description = "Core Mvge agent loop, invocation types, state management, and spell execution"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mvgeos-core",
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[tool.uv.sources]
mvgeos-core = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
