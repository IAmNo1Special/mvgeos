[project]
name = "mvgeos"
version = "0.1.0"
description = "MvgeOS — a Python-based AI coding agent inspired by pi"
requires-python = ">=3.14"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "filelock>=3.14",
    "git-cliff>=2.13.1",
]

[project.urls]
Repository = "https://github.com/mvgeos/mvgeos"

[tool.uv.workspace]
members = [
    "src/mvgeos/mvgeos-agent",
    "src/mvgeos/mvgeos-provider",
    "src/mvgeos/mvgeos-tome",
    "src/mvgeos/mvgeos-spells",
    "src/mvgeos/mvgeos-runes",
    "src/mvgeos/mvgeos-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvgeos"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "T20",
    "RSE",
    "PGH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT001"]
"*/__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["src/mvgeos/.*/tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

