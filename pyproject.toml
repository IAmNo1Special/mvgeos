[project]
name = "mvgeos"
version = "0.1.0"
description = "MvgeOS — a Python-based AI coding agent"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "coding-mvge",
    "git-cliff>=2.13.1",
    "mvgeos-agent",
    "mvgeos-cli",
    "mvgeos-gui",
    "mvgeos-provider",
    "mvgeos-runes",
    "mvgeos-tome",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260815",
]

[project.urls]
Repository = "https://github.com/IAmNo1Special/mvgeos"

[tool.uv.workspace]
members = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "mvgeos-cli",
    "mvgeos-gui",
    "coding-mvge",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true, editable = true }
mvgeos-provider = { workspace = true, editable = true }
mvgeos-tome = { workspace = true, editable = true }
mvgeos-runes = { workspace = true, editable = true }
mvgeos-cli = { workspace = true, editable = true }
mvgeos-gui = { workspace = true, editable = true }
coding-mvge = { workspace = true, editable = true }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "T20",
    "RSE",
    "PGH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT001"]
"*/__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.14"
strict = true
# warn_unreachable is the one strict-mode gap worth closing explicitly;
# every other previously listed flag is implied by strict or default-on.
warn_unreachable = true
exclude = ["/tests/", "/scripts/"]

[tool.pytest.ini_options]
testpaths = [
    "coding-mvge/tests",
    "mvgeos-agent/tests",
    "mvgeos-provider/tests",
    "mvgeos-runes/tests",
    "mvgeos-tome/tests",
    "mvgeos-cli/tests",
    "mvgeos-gui/tests",
]
pythonpath = "."
python_files = "*.py"
python_classes = "Test*"
python_functions = "test_*"
# Test dirs must NOT contain __init__.py. With importlib mode, packaged test
# dirs collapse to the same dotted path (tests.unit.types) across packages and
# silently shadow each other. Rootdir-relative naming keeps them distinct.
consider_namespace_packages = false
addopts = "--import-mode=importlib -W ignore::RuntimeWarning"

[tool.coverage.run]
branch = true
# Omit patterns are evidence-based: each entry corresponds to out-of-tree
# code observed in the bare-run report (charter section 2). The user-scope
# rune dir catches real runes imported during tests; the Temp patterns
# cover pytest tmp_path artifacts on Windows and Linux respectively.
omit = [
    "*/AppData/Local/Temp/**",
    "*/tmp*/**",
    "*/.agents/.mvgeos/runes/*",
]

[tool.coverage.report]
fail_under = 90
