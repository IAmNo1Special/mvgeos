[project]
name = "mvgeos"
version = "0.1.0"
description = "MvgeOS — a Python-based AI coding agent inspired by pi"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = [
    "git-cliff>=2.13.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[project.urls]
Repository = "https://github.com/IAmNo1Special/mvgeos"

[tool.uv.workspace]
members = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-tome",
    "mvgeos-runes",
    "mvgeos-cli",
    "coding-mvge",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "T20",
    "RSE",
    "PGH",
]

[tool.ruff.lint.per-file-ignores]
"tests_*/**" = ["T20", "PT001"]
"*/__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["mvgeos-[^/]+/tests_.*"]

[tool.pytest.ini_options]
testpaths = [
    "mvgeos-agent/tests_agent",
    "mvgeos-provider/tests_provider",
    "mvgeos-tome/tests_tome",
    "mvgeos-runes/tests_runes",
    "mvgeos-cli/tests_cli",
    "coding-mvge/test_coding_mvge",
]
pythonpath = "."

[tool.coverage.run]
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
