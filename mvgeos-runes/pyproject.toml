[project]
name = "mvgeos-runes"
version = "0.4.5"
description = "Extension system: manifest, loader, and sigil hook protocol"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mvgeos-core",
    "packaging",
    "pyyaml>=6.0",
    "watchdog>=6.0.0",
]

[tool.uv.sources]
mvgeos-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
