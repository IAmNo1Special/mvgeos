[project]
name = "mvgeos-runes"
version = "0.1.0"
description = "Extension system: manifest, loader, and sigil hook protocol"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "importlib_metadata>=8.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_runes"]

[tool.ruff]
extend = "../pyproject.toml"
