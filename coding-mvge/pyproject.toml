[project]
name = "coding_mvge"
version = "0.1.0"
description = "Hard-coded coding agent implementation for MvgeOS"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-runes",
    "mvgeos-tome",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }
mvgeos-tome = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_mvge"]

[tool.ruff]
extend = "../pyproject.toml"
