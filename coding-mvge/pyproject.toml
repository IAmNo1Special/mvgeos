[project]
name = "coding_mvge"
version = "1.0.1"
description = "Hard-coded coding agent implementation for MvgeOS"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-runes",
    "mvgeos-tome",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }
mvgeos-tome = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
