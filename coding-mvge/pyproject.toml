[project]
name = "coding_mvge"
version = "2.2.0"
description = "Concrete coding agent implementation for MvgeOS with built-in development spells"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mvgeos-agent",
    "mvgeos-provider",
    "mvgeos-runes",
]

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
